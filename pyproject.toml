[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iec61499-aas-reconfig"
version = "0.1.0"
description = "AAS-driven online reconfiguration of IEC 61499 modules on Eclipse 4diac FORTE"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "defusedxml>=0.7,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
opcua = ["asyncua>=1.1"]
aas = ["basyx-python-sdk>=2,<3"]
# The registration service (modreg): the lab's shared AAS model and the ontology check.
registration = [
    "aas-model @ git+https://github.com/tristan-schwoerer/aas-model.git@3e73c153b50b977c320a7257975bd1ba990c1e1f",
    "basyx-python-sdk>=2.1,<3",
    "rdflib>=7,<8",
]
test = ["pytest>=7,<9", "asyncua>=1.1", "basyx-python-sdk>=2,<3"]

[project.scripts]
iec61499 = "iec61499_mgmt.cli:main"
modgen = "modgen.__main__:main"
modsync = "modsync.__main__:main"

# One folder per future repository; the Python packages live inside them.
[tool.setuptools]
packages = ["iec61499_mgmt", "modgen", "modsync", "modreg"]

[tool.setuptools.package-dir]
iec61499_mgmt = "iec61499-mgmt-py/iec61499_mgmt"
modgen = "iec61499-skill-lib/modgen"
modsync = "aas61499-tools/modsync"
modreg = "aas61499-tools/modreg"

[tool.pytest.ini_options]
testpaths = ["iec61499-mgmt-py/tests", "iec61499-skill-lib/tests", "aas61499-tools/tests", "deploy/tests", "cell/tests"]
