[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iec61499-aas-reconfig"
version = "0.1.0"
description = "AAS-driven online reconfiguration of IEC 61499 modules on Eclipse 4diac FORTE"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "defusedxml>=0.7,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
opcua = ["asyncua>=1.1"]
# The registration service (modreg): the lab's shared AAS model and the ontology check.
registration = [
    # The archive, not git+: pip would fetch the submodules, whose paths are too long for Windows.
    "aas-model @ https://github.com/tristan-schwoerer/aas-model/archive/ea7d9a013d13b5740e7a581d14ae25e22432da11.zip",
    "basyx-python-sdk>=2.1,<3",
    "rdflib>=7,<8",
]
# Planning new skills (modplan): GTPyhop and the vocabulary.
planning = ["gtpyhop-core==2.0.2", "rdflib>=7,<8"]
# Standard planners on the exported PDDL and HDDL (modplan.export, tests and cell/eval/planners.py):
# unified-planning, ENHSP (needs Java) and Aries.
planners = ["unified-planning==1.3.0", "up-enhsp==0.1.1", "up-aries==0.5.0"]
test = ["pytest>=7,<9", "asyncua>=1.1", "basyx-python-sdk>=2,<3"]

[project.scripts]
iec61499 = "iec61499_mgmt.cli:main"
modgen = "modgen.__main__:main"
modsync = "modsync.__main__:main"
modreg = "modreg.__main__:main"
modplan = "modplan.__main__:main"

# One folder per future repository; the Python packages live inside them.
[tool.setuptools]
packages = ["iec61499_mgmt", "modgen", "modsync", "modreg", "modreg.generated", "modplan"]

[tool.setuptools.package-dir]
iec61499_mgmt = "iec61499-mgmt-py/iec61499_mgmt"
modgen = "iec61499-skill-lib/modgen"
modsync = "aas61499-tools/modsync"
modreg = "aas61499-tools/modreg"
modplan = "aas61499-tools/modplan"

[tool.setuptools.package-data]
modreg = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["iec61499-mgmt-py/tests", "iec61499-skill-lib/tests", "aas61499-tools/tests", "deploy/tests", "cell/tests"]
