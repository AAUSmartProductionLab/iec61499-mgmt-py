# Iteration 1 ("baby case"): one equipment item, one skill with one parameter, session-based
# occupation and a reduced PackML unit that runs the Execute procedure.
# Regenerate: python -m unitgen units/filler.yaml
unit: Filler
project: FillerUnit
package: filler
opcua_root: /Objects/Filler
modbus: {host: 127.0.0.1, port: 1502, unit: 1, poll_ms: 10}   # 4diac/tools/cell_sim.py

equipment:
  NeedleAxis:
    description: Needle lift with down/up valves, end switches and a position sensor
    inputs:
      AtTop:    {type: BOOL, modbus: d0, gpio: 17}
      AtBottom: {type: BOOL, modbus: d1, gpio: 27}
      Position: {type: LREAL, modbus: i1, scale: 0.1, unit: mm}   # mm below the top
    outputs:
      Down: {modbus: c0, gpio: 5}
      Up:   {modbus: c2, gpio: 6}
    commands:            # the first command is the safe state (all outputs off)
      Stop: []
      Down: [Down]
      Up: [Up]

skills:
  MoveNeedleDown:
    description: Lower the needle to Distance mm below the top; the default is all the way down
    equipment: NeedleAxis
    command: Down
    parameters:
      Distance: {type: LREAL, unit: mm, minimum: 0.0, maximum: 50.0, default: 50.0,
                 description: Target depth below the top position}
    requires: NOT (AtTop AND AtBottom)
    ensures: (Position >= Distance) OR AtBottom
    invariant: NOT (AtTop AND AtBottom)
    timeout: T#5s

procedures:
  Execute: [MoveNeedleDown]
