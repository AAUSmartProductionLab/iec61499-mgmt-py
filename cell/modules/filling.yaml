# Filling module ("Dispensing"). It began as a port of the ESP32 station
# (arduino_cpp_examples/Physical-Stations, FillingModule.cpp); since 8 Oct 2026 it is built from the
# components every module of the line is built from: a linear axis (a stepper motor with a limit
# switch, moved to a position), the filling pump, and a scale that is simulated.
# Regenerate: python -m modgen
module: Filling
project: FillingModule
package: filling
opcua_root: /Objects/Filling
modbus: {host: 127.0.0.1, port: 1502, unit: 1, poll_ms: 10}   # 4diac/tools/module_sim.py

targets:
  pc: {host: localhost, io: modbus}
  pi: {host: 192.168.0.203, user: admin, io: gpio, board: pi5,
       pwm_root: /hostsys/class/pwm}   # the filling Pi, a Raspberry Pi 5

equipment:
  LinearAxis:
    kind: LinearAxis
    description: Needle lift, a stepper motor through a step and direction driver, with a limit switch at the top (home)
    # The driver is a TB6600 (since 20 Oct; the RepRap Stepper Motor Driver v2.3 before it never energised
    # the motor). Its inputs PUL+, DIR+ and ENA+ are wired straight to the Pi's pins, PUL-, DIR- and ENA-
    # to GND: its optocouplers take the Pi's 3.3 V (homing and moves ran so on 21 Oct; on 20 Oct a 3.3 V
    # to 5 V level converter was in between, which is not needed).
    inputs:
      # An ordinary limit switch at the top, straight to the Pi: between the line and GND, closing when
      # pressed (the Pi's pull-up holds the line high otherwise).
      AtHome: {modbus: d0, gpio: {line: 23, bias: pull_up, active_low: true}}   # Pi pin 16
    outputs:
      # ENA+ high switches the TB6600 off: the motor is on while the line is low.
      Enable: {modbus: c0, gpio: {line: 17, active_low: true}}     # Pi pin 11
      Down:   {modbus: c1, gpio: 27}                               # Pi pin 13, DIR: on is down, away from the switch
      # PUL: PWM0 on GPIO18 (Pi pin 12; channel 2 on a Pi 5), one step per period (2 kHz since 20 Oct: at
      # 1 kHz the axis was too slow to home in 8 s); 50 % duty while it moves.
      Step:   {type: LREAL, modbus: h0, pwm: {channel: 0, period_ns: 500000}, gain: 655.35,
               minimum: 0, maximum: 100, unit: "%"}
    commands:
      Stop: {}
      Up:   {Enable: true, Step: 50}
      Down: {Enable: true, Down: true, Step: 50}
    # No encoder: the controller counts the time it steps. The stage (RATTMMOTOR, 300 mm stroke) has an
    # SFU1605 ball screw, 5 mm per turn, and a 1.8 degree Nema 23; the TB6600 is set to 4 microsteps (800
    # pulses per turn, SW1 on, SW2 and SW3 off): 160 pulses per mm, so 12.5 mm/s at the 2 kHz above. The
    # travel is still a placeholder. What error remains is taken out by homing after every operation.
    position: {unit: mm, speed: 12.5, increase: Down, decrease: Up, home: AtHome, minimum: 0.0, maximum: 60.0}
    sim: {stepper: {step: Step, direction: Down, enable: Enable, speed: 12.5, travel: 60.0, start: 15.0,
                    switches: {AtHome: 0.0}}}
  Pump:
    kind: FillingPump
    description: Filling pump; none is wired yet, so it has no outputs and dispensing is a time at the station's flow rate
    commands: {Idle: {}, Run: {}}
  Scale:
    kind: Scale
    description: Scale; the hardware has none, so the weight is simulated
    inputs:
      Weight: {type: LREAL, modbus: i0, scale: 0.001, sim: 2.0, unit: g}
    commands: {Idle: {}, Tare: {}, Measure: {}}
    sim: {values: {Weight: 2.0}}

skills:
  Home:
    description: Needle up to the limit switch; from there its position is known
    equipment: LinearAxis
    command: Up
    ensures: AtHome
    # Ends on the switch; the timeout only stops the motor if the switch never closes.
    timeout: 60s
  MoveAxis:
    description: Needle to Position, measured down from the limit switch; the direction follows from where it is
    equipment: LinearAxis
    move_to: Position
    parameters:
      Position: {unit: mm, minimum: 0.0, maximum: 60.0, default: 0.0, meaning: Position, description: Where to move to}
    timeout: 30s
  Dispense:
    description: Dispense a volume at the station's flow rate (open loop, by time, until a pump is wired)
    equipment: Pump
    command: Run
    parameters:
      Volume: {unit: mL, minimum: 0.5, maximum: 10.0, default: 1.0, meaning: FillVolume, description: Volume to dispense}
      FlowRate: {unit: mL/s, minimum: 0.1, maximum: 5.0, default: 1.0, meaning: FlowRate,
                 description: Flow rate of the station (calibration)}
    after: Volume / FlowRate
  Tare:
    description: Tare the scale
    equipment: Scale
    command: Tare
    after: 2.0
  Weigh:
    description: Read the weight
    equipment: Scale
    command: Measure
    after: 0.2
    results: {Weight: Weight}

composites:
  Dispensing:
    description: Needle down, dispense the volume, needle up, weigh (runFillingCycle)
    parameters:
      Volume: {unit: mL, minimum: 0.5, maximum: 10.0, default: 1.0, description: Fill volume}
    # The filling position and the flow rate are the station's: constants of the steps, changed by
    # reconfiguration. The needle goes back up by homing, so every cycle starts from the switch again.
    execute: [{MoveAxis: {Position: 40.0}, as: NeedleDown}, {Dispense: {Volume: Volume, FlowRate: 1.0}}, Home, Weigh]
    stop: [Home]                     # after an interruption the switch is what is certain
    results: {Weight: Weigh.Weight}

procedures:
  Resetting: [Home, Tare]          # find the reference, tare the scale
  Stopping: [Home]

# What the module offers to a product's processes: its AAS's Capability Description (IDTA 02020,
# role Offered). Which capability a skill offers and the properties its parameters set are derived
# from the skills (modreg.derive: Dispensing runs Dispense, which contributes Filling; its Volume
# means FillVolume, so its limits are the offered range). Stated here are the facts of the machine
# no skill sets. Meanings default to https://smartproductionlab.aau.dk/semantics/<Name>. The values
# are illustrative (as the vial filling station of the process planner's pharma example) until the
# station is measured.
capabilities:
  Filling:
    description: Fill a liquid into an open vial under the needle and weigh it
    properties:
      ContainerType: {value: vial}
      GraspDiameter: {minimum: 6.0, maximum: 30.0, unit: mm}
      AbsoluteFillError: {value: 0.05, unit: mL}
