# Filling module ("Dispensing"). It began as a port of the ESP32 station
# (arduino_cpp_examples/Physical-Stations, FillingModule.cpp); since 8 Oct 2026 it is built from the
# components every module of the line is built from: a linear axis (a stepper motor with a limit
# switch, moved to a position), the filling pump, and a scale that is simulated.
# Regenerate: python -m modgen
module: Filling
project: FillingModule
package: filling
opcua_root: /Objects/Filling
modbus: {host: 127.0.0.1, port: 1502, unit: 1, poll_ms: 10}   # 4diac/tools/module_sim.py

targets:
  pc: {host: localhost, io: modbus}
  pi: {host: 192.168.0.134, user: admin, io: gpio, board: pi5,
       pwm_root: /hostsys/class/pwm}   # the filling Pi, a Raspberry Pi 5

equipment:
  LinearAxis:
    kind: LinearAxis
    description: Needle lift, a stepper motor through a step and direction driver, with a limit switch at the top (home)
    # The driver is a RepRap Stepper Motor Driver v2.3 (Allegro A3982, https://reprap.org/wiki/Stepper_Motor_Driver_2.3).
    # Its 10-pin interface: 2 GND, 3 Step, 4 Dir, 5 !Enable, 6 Min, 7 Max (the endstops, passed through).
    # The board's logic runs on its own 5 V: the Pi's 3.3 V outputs and inputs need a level shifter.
    inputs:
      # The board's Min (pin 6): the endstop at the top. Which level means "at the switch" depends on the endstop.
      AtHome: {modbus: d0, gpio: {line: 23, bias: pull_up}}        # Pi pin 16
    outputs:
      # !Enable (pin 5) is inverted and pulled high on the board: the motor is on while the line is low.
      Enable: {modbus: c0, gpio: {line: 17, active_low: true}}     # Pi pin 11
      Down:   {modbus: c1, gpio: 27}                               # Pi pin 13, Dir (pin 4): on is down, away from the switch
      # Step (pin 3): PWM0 on GPIO18 (Pi pin 12), one step per period (1 kHz); 50 % duty while it moves.
      Step:   {type: LREAL, modbus: h0, pwm: {channel: 0, period_ns: 1000000}, gain: 655.35,
               minimum: 0, maximum: 100, unit: "%"}
    commands:
      Stop: {}
      Up:   {Enable: true, Step: 50}
      Down: {Enable: true, Down: true, Step: 50}
    # No encoder: the controller counts the time it steps, as a 3D printer counts its steps. The speed
    # (mm per second at the step rate above) and the travel are placeholders until the axis is measured.
    position: {unit: mm, speed: 20.0, increase: Down, decrease: Up, home: AtHome, minimum: 0.0, maximum: 60.0}
    sim: {stepper: {step: Step, direction: Down, enable: Enable, speed: 20.0, travel: 60.0, start: 15.0,
                    switches: {AtHome: 0.0}}}
  Pump:
    kind: FillingPump
    description: Filling pump; none is wired yet, so it has no outputs and dispensing is a time at the station's flow rate
    commands: {Idle: {}, Run: {}}
  Scale:
    kind: Scale
    description: Scale; the hardware has none, so the weight is simulated
    inputs:
      Weight: {type: LREAL, modbus: i0, scale: 0.001, sim: 2.0, unit: g}
    commands: {Idle: {}, Tare: {}, Measure: {}}
    sim: {values: {Weight: 2.0}}

skills:
  Home:
    description: Needle up to the limit switch; from there its position is known
    equipment: LinearAxis
    command: Up
    ensures: AtHome
    timeout: 8s
  MoveAxis:
    description: Needle to Position, measured down from the limit switch; the direction follows from where it is
    equipment: LinearAxis
    move_to: Position
    parameters:
      Position: {unit: mm, minimum: 0.0, maximum: 60.0, default: 0.0, description: Where to move to}
    timeout: 8s
  Dispense:
    description: Dispense a volume at the station's flow rate (open loop, by time, until a pump is wired)
    equipment: Pump
    command: Run
    parameters:
      Volume: {unit: mL, minimum: 0.5, maximum: 10.0, default: 1.0, description: Volume to dispense}
      FlowRate: {unit: mL/s, minimum: 0.1, maximum: 5.0, default: 1.0, description: Flow rate of the station (calibration)}
    after: Volume / FlowRate
  Tare:
    description: Tare the scale
    equipment: Scale
    command: Tare
    after: 2.0
  Weigh:
    description: Read the weight
    equipment: Scale
    command: Measure
    after: 0.2
    results: {Weight: Weight}

composites:
  Dispensing:
    description: Needle down, dispense the volume, needle up, weigh (runFillingCycle)
    parameters:
      Volume: {unit: mL, minimum: 0.5, maximum: 10.0, default: 1.0, description: Fill volume}
    # The filling position and the flow rate are the station's: constants of the steps, changed by
    # reconfiguration.
    execute: [{MoveAxis: {Position: 40.0}, as: NeedleDown}, {Dispense: {Volume: Volume, FlowRate: 1.0}},
              {MoveAxis: {Position: 0.0}, as: NeedleUp}, Weigh]
    stop: [Home]                     # after an interruption the switch is what is certain
    results: {Weight: Weigh.Weight}

procedures:
  Resetting: [Home, Tare]          # find the reference, tare the scale
  Stopping: [Home]

# What the module offers to a product's processes: its AAS's Capability Description (IDTA 02020,
# role Offered), each capability realized by an offered skill (CapabilityRealizedBy). Meanings
# default to https://smartproductionlab.aau.dk/semantics/<Name>. The values are illustrative (as
# the vial filling station of the process planner's pharma example) until the station is measured;
# FillVolume is set by Dispensing's Volume parameter; without a pump the volume is a time at the
# station's flow rate (Dispense).
capabilities:
  Filling:
    description: Fill a liquid into an open vial under the needle and weigh it
    realized_by: Dispensing
    properties:
      ContainerType: {value: vial}
      GraspDiameter: {minimum: 6.0, maximum: 30.0, unit: mm}
      FillVolume: {minimum: 0.5, maximum: 10.0, unit: mL, parameter: Volume}
      AbsoluteFillError: {value: 0.05, unit: mL}
