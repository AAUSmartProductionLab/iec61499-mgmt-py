# Stoppering module. It began as a port of the ESP32-S3 station (StopperingModule.cpp: a piston on a
# DC motor, a servo arm and a plunger); since 8 Oct 2026 it is built like the other modules of the
# line: a linear axis that brings the head down onto the vial (a stepper motor with a limit switch,
# moved to a position) and one small linear actuator that presses the stopper in.
# Regenerate: python -m modgen
module: Stoppering
project: StopperingModule
package: stoppering
opcua_root: /Objects/Stoppering
modbus: {host: 127.0.0.1, port: 1503, unit: 1, poll_ms: 10}   # 4diac/tools/module_sim.py

targets:
  pc: {host: localhost, io: modbus}
  pi: {host: stoppering-pi, user: iiot_gateway, io: gpio,
       pwm_root: /hostsys/class/pwm}    # the stoppering Pi (set its address)

equipment:
  LinearAxis:
    kind: LinearAxis
    description: Lift of the stoppering head, a stepper motor through a step and direction driver, with a limit switch at the top (home)
    inputs:
      AtHome: {modbus: d0, gpio: {line: 23, bias: pull_up}}        # pin 16
    outputs:
      Enable: {modbus: c0, gpio: 17}                               # pin 11, the driver's enable
      Down:   {modbus: c1, gpio: 27}                               # pin 13, the driver's DIR: on is down, away from the switch
      # The driver's STEP: PWM0 on GPIO18 (pin 12), one step per period (1 kHz); 50 % duty while it moves.
      Step:   {type: LREAL, modbus: h0, pwm: {channel: 0, period_ns: 1000000}, gain: 655.35,
               minimum: 0, maximum: 100, unit: "%"}
    commands:
      Stop: {}
      Up:   {Enable: true, Step: 50}
      Down: {Enable: true, Down: true, Step: 50}
    # As the filling module's axis: the speed and the travel are placeholders until it is measured.
    position: {unit: mm, speed: 20.0, increase: Down, decrease: Up, home: AtHome, minimum: 0.0, maximum: 60.0}
    sim: {stepper: {step: Step, direction: Down, enable: Enable, speed: 20.0, travel: 60.0, start: 15.0,
                    switches: {AtHome: 0.0}}}
  Piston:
    kind: StopperingPiston
    description: Small linear actuator that presses the stopper in, through an L298N (IN1 retract, IN2 extend); no sensors
    outputs:
      Retract: {modbus: c2, gpio: 5}                               # pin 29, IN1
      Extend:  {modbus: c3, gpio: 6}                               # pin 31, IN2
    commands:
      Stop: {}
      Extend: [Extend]
      Retract: [Retract]
      # Back in and off: what ends a press, also one that is cut short. The stroke times are
      # placeholders until the actuator is measured.
      Back: [{Retract: true, for: 3s}, {}]
    sim: {axis: {forward: Extend, backward: Retract, travel_s: 3.0, start: 0.0}}

skills:
  Home:
    description: Head up to the limit switch; from there its position is known
    equipment: LinearAxis
    command: Up
    ensures: AtHome
    timeout: 8s
  MoveAxis:
    description: Head to Position, measured down from the limit switch; the direction follows from where it is
    equipment: LinearAxis
    move_to: Position
    parameters:
      Position: {unit: mm, minimum: 0.0, maximum: 60.0, default: 0.0, description: Where to move to}
    timeout: 8s
  PressStopper:
    description: Press the stopper in, the piston out for the stroke and back in (open loop, by time)
    equipment: Piston
    command: Extend
    stop: Back
    after: 3.0
  RetractPiston:
    description: Piston back in for the stroke (open loop); for a piston left out by an abort
    equipment: Piston
    command: Retract
    after: 3.0

composites:
  Stoppering:
    description: Head down onto the vial, press the stopper in, head up again
    # The working position is the station's: a constant of the step, changed by reconfiguration.
    execute: [{MoveAxis: {Position: 40.0}, as: HeadDown}, PressStopper, {MoveAxis: {Position: 0.0}, as: HeadUp}]
    stop: [Home]

procedures:
  Resetting: [RetractPiston, Home]     # the piston in before the head moves
  Stopping: [Home]

# What the module offers (see filling.yaml): illustrative values, as the vial stoppering station of
# the process planner's pharma example, until the station is measured.
capabilities:
  Stoppering:
    description: Place a rubber stopper on a filled vial and press it in
    realized_by: Stoppering
    properties:
      ContainerType: {value: vial}
      GraspDiameter: {minimum: 6.0, maximum: 30.0, unit: mm}
      StopperDiameter: {minimum: 6.0, maximum: 20.0, unit: mm}
