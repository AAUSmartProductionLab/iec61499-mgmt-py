# Capping module. Planned, not built: the lab has no capping station yet, so there is no program
# and no hardware behind this spec. The equipment and the motions are a first description to work
# with (7 Oct 2026), written like the filling and stoppering modules; the capability is that of the
# process planner's vial capping station, with illustrative values.
# It lives outside cell/modules so that no project is generated for it. Its AAS: modreg build <this file>.
module: Capping
project: CappingModule
package: capping
opcua_root: /Objects/Capping
modbus: {host: 127.0.0.1, port: 1504, unit: 1, poll_ms: 10}

targets:
  pc: {host: localhost, io: modbus}

# Components as named on 8 Oct 2026: a linear axis (as in the filling and stoppering modules) and the
# cap crimper. How the crimper is driven is a guess.
equipment:
  LinearAxis:
    kind: LinearAxis
    description: Lift of the crimping head, a stepper motor through a step and direction driver, with a limit switch at the top (home)
    inputs:
      AtHome: {modbus: d0}
    outputs:
      Enable: {modbus: c0}
      Down:   {modbus: c1}
      Step:   {type: LREAL, modbus: h0, gain: 655.35, minimum: 0, maximum: 100, unit: "%"}
    commands:
      Stop: {}
      Up:   {Enable: true, Step: 50}
      Down: {Enable: true, Down: true, Step: 50}
    position: {unit: mm, speed: 20.0, increase: Down, decrease: Up, home: AtHome, minimum: 0.0, maximum: 60.0}
  Crimper:
    kind: CapCrimper
    description: Crimping head that closes around the cap
    outputs:
      Close: {modbus: c2}
    commands:
      Open: {}
      Close: [Close]

skills:
  Home:
    description: Head up to the limit switch; from there its position is known
    equipment: LinearAxis
    command: Up
    ensures: AtHome
    timeout: 8s
  MoveAxis:
    description: Head to Position, measured down from the limit switch; the direction follows from where it is
    equipment: LinearAxis
    move_to: Position
    parameters:
      Position: {unit: mm, minimum: 0.0, maximum: 60.0, default: 0.0, description: Where to move to}
    timeout: 8s
  Crimp:
    description: Close the crimper for Duration, then open it
    equipment: Crimper
    command: Close
    parameters:
      Duration: {unit: s, minimum: 0.0, maximum: 5.0, default: 1.5}
    after: Duration

composites:
  Capping:
    description: Head down onto the cap, crimp, head up again
    execute: [{MoveAxis: {Position: 40.0}, as: HeadDown}, Crimp, Home]
    stop: [Home]

procedures:
  Resetting: [Home]
  Stopping: [Home]

capabilities:
  Capping:
    description: Put a cap on a stoppered vial and crimp it
    realized_by: Capping
    properties:
      ContainerType: {value: vial}
      GraspDiameter: {minimum: 6.0, maximum: 30.0, unit: mm}
      CapDiameter: {minimum: 13.0, maximum: 20.0, unit: mm}
