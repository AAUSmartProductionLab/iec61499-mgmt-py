# Unloading module: a KUKA robot (KR C4) takes the container off its shuttle and places it in the
# tray. Served in Python by modpy (module-py), as the loading module is (loading.yaml says how); its
# robot runs a program of its own, so its jobs are numbered from 1 too.
#     python -m modpy serve cell/modules/python/unloading.yaml --port 4841
module: Unloading
project: UnloadingModule
package: unloading
opcua_root: /Objects/Unloading
modbus: {host: 127.0.0.1, port: 1506, unit: 1, poll_ms: 10}

targets:
  pi: {host: unloading-module.local, user: admin}

equipment:
  Robot:
    kind: Robot
    description: KUKA robot (KR C4) with its gripper on the robot's own IO, switched by the robot program inside its jobs
    # The contract with the robot program, as the loading module's.
    inputs:
      Ready:     {modbus: d0}
      Busy:      {modbus: d1}
      Done:      {modbus: d2}
      JobDone:   {type: LREAL, modbus: i0}
      Error:     {modbus: d3}
      ErrorCode: {type: LREAL, modbus: i1}
    outputs:
      Job:   {type: LREAL, modbus: h0, minimum: 0, maximum: 99}
      Start: {modbus: c0}
    commands:
      Stop: {}
      Await: {}
      Home:            [{Job: 1, for: 200ms}, {Job: 1, Start: true}]
      PickFromShuttle: [{Job: 2, for: 200ms}, {Job: 2, Start: true}]
      PlaceInTray:     [{Job: 3, for: 200ms}, {Job: 3, Start: true}]
    sim: {robot: {seconds: {1: 2.0, 2: 3.0, 3: 3.0}}}

skills:
  Home:
    description: The robot to its home pose (job 1)
    equipment: Robot
    command: Home
    precondition: Ready AND NOT Busy
    postcondition: Done AND JobDone = 1
    invariant: NOT Error
    timeout: 60s
  PickFromShuttle:
    description: The gripper takes the container off the shuttle at the transfer point (job 2)
    equipment: Robot
    command: PickFromShuttle
    precondition: Ready AND NOT Busy
    postcondition: Done AND JobDone = 2
    invariant: NOT Error
    timeout: 60s
  PlaceInTray:
    description: The container into the next free slot of the tray (job 3; the robot program counts the slots)
    equipment: Robot
    command: PlaceInTray
    precondition: Ready AND NOT Busy
    postcondition: Done AND JobDone = 3
    invariant: NOT Error
    timeout: 60s
  AwaitJob:
    description: Wait until the robot has ended the job it runs; a module stopped during a job lets the robot finish it
    equipment: Robot
    command: Await
    postcondition: NOT Busy
    timeout: 120s

composites:
  Unloading:
    description: The container off the shuttle into the tray, then the robot home
    execute: [PickFromShuttle, PlaceInTray, Home]
    stop: [AwaitJob]

procedures:
  Resetting: [AwaitJob, Home]
  Stopping: [AwaitJob]
stop_timeout: 120s                 # as the loading module's: the robot finishes its job

points:
  Transfer: {meaning: TransferPoint, location: {y: 120.0, rz: -90.0}, description: Where a shuttle stands for the robot to take the container off it}

capabilities:
  Unloading:
    description: Take a container off its shuttle and place it in the tray
    properties:
      ContainerType: {values: [vial, syringe, cartridge]}
      GraspDiameter: {minimum: 6.0, maximum: 30.0, unit: mm}
