# FORTE on the Raspberry Pi. Copied to ~/forte on the Pi by deploy/pi.py install; there:
#   docker compose up -d | stop | start | restart | logs -f | ps
services:
  forte:
    build: .
    image: forte-pi:3.3.0
    container_name: forte
    restart: unless-stopped          # comes back after a reboot unless stopped by hand
    # Host network: OPC UA advertises the Pi's own address in its endpoints, and the management
    # port (61499, no authentication: lab network only) and Modbus clients need no mapping.
    network_mode: host
    devices:
      # GPIO lines for GPIOChip (the container runs as root): the chip of the 40-pin header, as
      # chip 0. runtime/install.sh writes which one it is to .env (4 on a Pi 5 with an older kernel).
      - ${GPIOCHIP:-/dev/gpiochip0}:/dev/gpiochip0
    volumes:
      - ./boot:/forte                  # forte.fboot: the program FORTE loads at start
      # PWM channels for FORTE's pwmsysfs module (PWMChip SysfsRoot /hostsys/class/pwm). Outside
      # /sys, because the container's sysfs is read-only and AppArmor denies writes below /sys;
      # the class entries link relatively into ../../devices, hence both folders.
      - /sys/class/pwm:/hostsys/class/pwm
      - /sys/devices/platform:/hostsys/devices/platform
    stop_grace_period: 5s
