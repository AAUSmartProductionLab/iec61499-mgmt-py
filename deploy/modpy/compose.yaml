# The robot modules on a Raspberry Pi, run in Python (modpy). On the Pi, in a clone of the
# repository, with the modules' manifest made on the PC (modreg manifest
# cell/modules/python/loading.yaml --out manifest.json) copied to deploy/modpy/manifest/:
#   docker compose -f deploy/modpy/compose.yaml up -d --build | logs -f | ps
# One OPC UA server for the modules this Pi runs, each below /Objects/<Module> (a manifest for
# several holds all their profiles, with "module": null). Beside the planar controller, which has
# 4840, give it another --port.
services:
  modpy:
    build:
      context: ../..
      dockerfile: deploy/modpy/Dockerfile
    image: modpy:latest
    container_name: modpy
    restart: unless-stopped
    # Host network: the mDNS announcement on the Pi's own network, and OPC UA's endpoints carry the
    # Pi's address.
    network_mode: host
    command: ["specs/loading.yaml", "--port", "4840", "--announce", "--manifest", "/manifest/manifest.json"]
    volumes:
      - ./manifest:/manifest:ro
    stop_grace_period: 5s
